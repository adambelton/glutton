databases:
  - name: glutton-staging-db
    databaseName: glutton_staging
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []

envVarGroups:
  - name: glutton-staging
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true

services:
  - type: web
    name: glutton-staging-web
    runtime: ruby
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: bundle install && SECRET_KEY_BASE_DUMMY=1 bin/rails assets:precompile
    preDeployCommand: bin/rails db:prepare
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "0"
      - fromGroup: glutton-staging
      - key: DATABASE_URL
        fromDatabase:
          name: glutton-staging-db
          property: connectionString

  - type: worker
    name: glutton-staging-worker
    runtime: ruby
    region: frankfurt
    plan: 0.5c-512mb
    autoDeployTrigger: "off"
    buildCommand: bundle install
    startCommand: bundle exec good_job start
    envVars:
      - key: RAILS_ENV
        value: production
      - fromGroup: glutton-staging
      - key: DATABASE_URL
        fromDatabase:
          name: glutton-staging-db
          property: connectionString
