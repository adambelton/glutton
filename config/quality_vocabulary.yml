- name: Bittersweet survival
  match_rule: Survival is achieved alongside loss that qualifies the outcome as bittersweet.
  not_sufficient: Survival or loss alone without a mixed positive and sorrowful outcome does not establish bittersweet survival.
  quality_category_name: Resolution and aftermath
- name: Costly self-sacrifice
  match_rule: A character deliberately incurs grave personal cost to protect another or contain danger in the resolution.
  not_sufficient: Accidental loss or help without self-incurred grave cost does not establish costly self-sacrifice.
  quality_category_name: Resolution and aftermath
- name: Catastrophic defeat
  match_rule: The resolution establishes a major victory for the threat or destruction of the protagonists' aims.
