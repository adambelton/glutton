  quality_category_name: Emotional tone and experience
- name: Dreamlike atmosphere
  match_rule: The film's atmosphere is described as dreamlike or unreal.
  not_sufficient: A character sleeping or a dream mentioned in a synopsis alone does not establish a dreamlike atmosphere.
  quality_category_name: Emotional tone and experience
- name: Hallucinatory intensity
  match_rule: The film's sensory presentation is described as hallucinatory or perceptually overwhelming.
  not_sufficient: A character hallucinating in the story without sensory-presentation evidence does not establish hallucinatory intensity.
  quality_category_name: Emotional tone and experience
- name: Dread of inevitability
  match_rule: The film presents or evokes a sense that a feared outcome cannot be prevented.
  not_sufficient: An adverse event occurring without a sense of inevitability does not establish dread of inevitability.
  quality_category_name: Emotional tone and experience
- name: Playful camp
  match_rule: The film's tone uses theatrical excess or knowingly artificial playfulness.
  not_sufficient: Visible artifice or an audience laughing unintentionally alone does not establish playful camp.
  quality_category_name: Emotional tone and experience
- name: Absurd humour
  match_rule: Illogical or absurd situations are treated as humour.
  not_sufficient: Unexplained events without comic treatment do not establish absurd humour.
  quality_category_name: Emotional tone and experience
- name: Black comedy
  match_rule: Death, suffering or taboo subjects receive darkly comic treatment.
  not_sufficient: Death or a taboo appearing without comic treatment does not establish black comedy.
  quality_category_name: Emotional tone and experience
- name: Satirical ridicule
  match_rule: The film uses ridicule to criticise a social target or institution.
  not_sufficient: Comedy without a target of criticism does not establish satirical ridicule.
  quality_category_name: Emotional tone and experience
- name: Exuberant splatter
  match_rule: Graphic bodily destruction is presented or reported as exuberant spectacle.
  not_sufficient: Gore without exuberant presentation or an attributed exuberant response does not establish this tone.
  quality_category_name: Emotional tone and experience
- name: Action exhilaration
  match_rule: Physical action is presented or reported as exciting or exhilarating.
  not_sufficient: Action events without presentation or attributed excitement do not establish action exhilaration.
  quality_category_name: Emotional tone and experience
- name: Contemplative quiet
  match_rule: Quiet scenes or presentation invite reflection or are described as contemplative.
  not_sufficient: Little dialogue without reflective presentation does not establish contemplative quiet.
  quality_category_name: Emotional tone and experience
- name: Dark fairy-tale atmosphere
  match_rule: Fairy-tale-like wonder, logic or imagery is combined with menace.
  not_sufficient: A fairy-tale reference without a menacing fairy-tale treatment does not establish this atmosphere.
  quality_category_name: Emotional tone and experience
- name: Tragic pathos
  match_rule: A character's downfall is framed or described in a way that invites sorrow.
  not_sufficient: A death without sympathetic or sorrowful framing does not establish tragic pathos.
  quality_category_name: Emotional tone and experience
- name: Tenderness amid horror
  match_rule: Emotional gentleness or care is portrayed alongside horror.
  not_sufficient: A character helping for purely instrumental reasons without tenderness does not establish this tone.
  quality_category_name: Emotional tone and experience
- name: Moral discomfort
  match_rule: Compromised choices or complicity are presented or reported as morally unsettling.
  not_sufficient: Wrongdoing without morally unsettling framing or an attributed response does not establish moral discomfort.
  quality_category_name: Emotional tone and experience
- name: Deliberate provocation
  match_rule: The film confronts taboos or boundaries in a way described as deliberately provocative.
  not_sufficient: A taboo topic's presence alone or an unused intention does not establish provocative treatment.
  quality_category_name: Emotional tone and experience
- name: Otherworldly awe
  match_rule: An encounter beyond ordinary experience is linked to awe or wonder.
  not_sufficient: A supernatural encounter without awe or wonder in its presentation or attributed response does not establish this quality.
  quality_category_name: Emotional tone and experience
- name: Cynical outlook
  match_rule: The film's outlook presents human motives or institutions through distrust or disillusionment.
  not_sufficient: One dishonest character without cynical framing does not establish a cynical outlook.
  quality_category_name: Emotional tone and experience
- name: Unresolved identity at the ending
  match_rule: A character's identity or nature remains unresolved at the film's conclusion.
  not_sufficient: An incomplete source account or unknown background detail does not establish an unresolved character identity at the ending.
