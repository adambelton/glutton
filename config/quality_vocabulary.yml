- name: Prolonged suffering
  match_rule: The presentation dwells on suffering or torture over an extended interval.
  not_sufficient: A character suffering for years in story time without extended presentation does not establish prolonged on-screen suffering.
  quality_category_name: Presentation and intensity
- name: Sexual violence
  match_rule: Sexual assault or coercive sexual harm occurs in the story.
  not_sufficient: Consensual sex or nonsexual violence alone does not establish sexual violence.
  quality_category_name: Presentation and intensity
- name: Harm to animals
  match_rule: An animal is harmed or killed within the story's events.
  not_sufficient: A dangerous animal or a threat not carried out does not establish harm to animals.
  quality_category_name: Presentation and intensity
- name: Children in danger
  match_rule: A child faces a threat of physical harm within the story.
  not_sufficient: Concern for a child actor during production or an adult described as childlike does not establish a child character in danger.
  quality_category_name: Presentation and intensity
- name: Physical action spectacle
  match_rule: Chases, stunts or physical combat are presented as kinetic spectacle.
  not_sufficient: A fight mentioned in a synopsis without action-presentation detail does not establish action spectacle.
  quality_category_name: Presentation and intensity
- name: Sustained dread
  match_rule: The film's tone or an attributed response is described as an ongoing feeling of impending danger.
  not_sufficient: One frightening event without a continuing apprehensive tone does not establish sustained dread.
  quality_category_name: Emotional tone and experience
- name: Abrupt shock
  match_rule: The film's presentation or an attributed response involves a sudden shocking disruption.
  not_sufficient: A rapid event without a shocking presentation or attributed response does not establish abrupt shock.
  quality_category_name: Emotional tone and experience
- name: Disgust and revulsion
  match_rule: The film's presentation or an attributed response is described in terms of disgust or revulsion.
  not_sufficient: A disgusting object in a synopsis without presentation or response evidence does not establish a disgust register.
  quality_category_name: Emotional tone and experience
- name: Bleakness and nihilism
  match_rule: The film's tone or outlook is described as bleak, nihilistic or despairing.
  not_sufficient: A character suffering without evidence of a bleak tone or nihilistic outlook does not establish this quality.
  quality_category_name: Emotional tone and experience
- name: Melancholy
  match_rule: The film's emotional register is described as sorrowful or wistful.
  not_sufficient: A sad event alone without tonal description does not establish melancholy.
  quality_category_name: Emotional tone and experience
- name: Anxious uncertainty
  match_rule: Uncertainty about events or identities creates anxious tension in the supplied account.
  not_sufficient: Missing source information without described uncertainty or tension in the film does not establish anxious uncertainty.
  quality_category_name: Emotional tone and experience
- name: Oppressive claustrophobia
  match_rule: Confinement is described as creating an oppressive or claustrophobic experience.
