  quality_category_name: Resolution and aftermath
- name: Continuation of the cycle
  match_rule: The resolution establishes that a harmful pattern continues or begins again.
  not_sufficient: A surviving entity without an established continuation of harmful behaviour does not establish a continuing cycle.
  quality_category_name: Resolution and aftermath
- name: Moral refusal
  match_rule: In the resolution a character refuses a tempting choice that would harm others or violate their commitments.
  not_sufficient: Avoiding an unwanted option without temptation or moral conflict does not establish moral refusal.
  quality_category_name: Resolution and aftermath
- name: Ironic punishment
  match_rule: The resolution links a character's downfall to the desire or wrongdoing that motivated them.
  not_sufficient: A character's misfortune without a connection to their desire or wrongdoing does not establish ironic punishment.
  quality_category_name: Resolution and aftermath
- name: Relationship reconciliation
  match_rule: A damaged relationship is repaired in the resolution.
  not_sufficient: People surviving together without repair of their relationship does not establish reconciliation.
  quality_category_name: Resolution and aftermath
- name: Hopeful renewal
  match_rule: The ending presents recovery or a positive new beginning after the threat.
  not_sufficient: The ending merely stopping without a supported prospect of renewal does not establish hopeful renewal.
  quality_category_name: Resolution and aftermath
- name: Morally ambiguous outcome
  match_rule: The ending leaves competing moral evaluations of characters' choices unresolved.
  not_sufficient: Uncertainty only about events or identity without competing moral readings does not establish moral ambiguity.
  quality_category_name: Resolution and aftermath
- name: Humans are the real monsters
  match_rule: Human cruelty is framed as more monstrous than, or as the horror underlying, an apparent nonhuman threat.
  not_sufficient: A human antagonist or cruel act without this comparative moral framing does not establish humans as the real monsters.
