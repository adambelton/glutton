en:
  identity:
    privacy_notice:
      title: Privacy Notice
      operator: Adam Belton operates Glutton and is responsible for how it uses your personal data. Contact hello@adambelton.com with privacy questions or requests.
      data:
        title: What Glutton uses
        description: Glutton uses your email address and a securely hashed password to manage your account. It uses private ratings, notes, library entries and recommendation activity to provide the service and personalise recommendations. A session cookie keeps you signed in, and local browser storage remembers your theme choice.
      lawful_bases:
        title: Why Glutton uses this data
        description: Glutton uses your account and viewing activity to provide the service you request under the Terms of Service. Glutton has a legitimate interest in keeping the service secure and recoverable, including using operational logs and backups for those purposes.
      providers:
        title: Who helps provide Glutton
        ai_title: Who analyses your rating notes
        ai_intro: Glutton leaves your account email and password out of AI requests. Any personal details you write in a note are part of the text sent.
        typesafe:
          name: TypeSafe AI
          description: Glutton sends note text and an internal rating reference to TypeSafe AI in the United States to identify the film qualities you describe. Under TypeSafe’s standard settings, it keeps submitted content as long as reasonably necessary to provide the service. It does not publish a fixed retention period.
        openai:
          name: OpenAI
          description: Glutton sends note text and film context directly to OpenAI to build or refresh your taste profile. OpenAI may process these requests outside the UK. Under standard API settings, abuse monitoring logs can contain submitted text for up to 30 days, with exceptions for legal or safety reasons.
        paragraphs:
          - Render hosts Glutton and its database in Frankfurt, Germany.
          - When account email delivery is enabled, Resend processes recipient email addresses and account messages in the United States. Fastmail handles correspondence sent to Glutton’s contact address.
          - Your browser connects to The Movie Database to load posters and to Google’s YouTube service when a trailer appears. These requests give the services information such as your IP address and the poster or trailer requested. The services handle those requests under their own privacy policies.
      international_transfers:
        title: How Glutton protects international transfers
        paragraphs:
          - Germany is covered by the UK’s adequacy regulations. For transfers to the United States that are covered by Render’s UK Extension to the EU–US Data Privacy Framework certification, Render’s agreement uses that framework. It provides contractual safeguards for UK transfers where the framework does not apply.
          - The data processing agreements for TypeSafe, OpenAI and Resend include standard contractual clauses with the UK International Data Transfer Addendum for restricted transfers from the UK. You can contact hello@adambelton.com for a copy of the applicable safeguards and information about where your data is processed.
      retention:
        title: How long Glutton keeps your data
        description: Glutton keeps your account and saved activity while your account is open. An unfinished registration expires after one hour, and guest access expires after 24 hours. Expired records are removed during cleanup.
      account_deletion:
        title: Deleting your account
        description: You can delete your account in Account Settings. This ends your sessions and deletes your sign-in details, ratings, notes, library entries, recommendation activity and taste profile from the live service. Guest activity is temporary and is deleted when expired guest accounts are cleaned up.
      backups:
        title: Backups
        description: A backup taken before deletion may contain a copy of your account and activity until the backup expires. Backups are kept for recovery. Before returning a restored database to service, Glutton must reapply deletions made since the backup was taken.
      rights:
        title: Your privacy rights
        description: You can contact hello@adambelton.com to request access to, correction of or deletion of your personal data, or to exercise other applicable data protection rights. You can also complain to the UK Information Commissioner's Office.
