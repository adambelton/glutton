      features:
        ratings:
          samples: Rating samples
          eyebrow: 01 / Ratings
          title: "Rate it. Write what stayed with you."
          description: "Two people can love the same film for completely different reasons. Rate your own experience, then capture whatever made an impression. There's no review format to follow, just your experience in your own words."
        recommendations:
          samples: Recommendation samples
          eyebrow: 02 / Recommendations
          title: "Find horror that gets you."
          description: "Glutton looks beyond genres and conventional ratings to find connections between what films offer and what you personally respond to. Your ratings reveal patterns in your taste, while your notes help explain why particular films connected with you."
        library:
          eyebrow: 03 / Library
          title: "Your horror history, all in one place."
          description: "Keep track of everything you've watched, everything you want to watch, and everything you thought along the way. Your Library brings your ratings, notes and Watchlist together in one personal record of your relationship with horror."
        profile:
          eyebrow: 04 / Glutton Profile
          title: "Discover what makes horror work for you."
          description: "Your taste is more than a collection of favourite genres. Your Glutton Profile brings together patterns in your ratings and notes to reveal the qualities you respond to, why they matter to you, and how your taste develops over time."
      faq:
        title: Frequently asked questions
        questions:
          - question: "Who makes Glutton?"
            answer:
              - "I'm Adam. I'm a Canadian living in the UK, a Liverpool FC supporter, a horror junkie, and the solo developer behind Glutton."
              - "Horror is deeply subjective. You can love a terrible film and hate a critically acclaimed masterpiece. I'm building something that understands my personal taste, helps me discover more of the horror I crave, and becomes part of my ritual of consuming it."
          - question: "Is Glutton free?"
            answer:
              - "Yes. Glutton is completely free to use, with no ads."
              - "Right now, I'm more interested in building something people love than making money from it."
              - "Eventually, I'll need to figure out how to make Glutton financially sustainable, but I haven't decided what that looks like yet."
          - question: "Why should I write notes about films?"
            answer:
              - "Because sometimes a rating just isn't enough."
              - "Maybe a film genuinely frightened you. Maybe its atmosphere stuck with you for days. Or maybe everyone else loved it, but something about it just didn't work for you."
              - "Your notes give those experiences somewhere to live. They're a personal record you can revisit, and they help Glutton understand your taste. Longer term, they could even help improve recommendations for other horror fans."
              - "You don't need to write reviews. A few words about what stayed with you are enough."
          - question: "How does Glutton recommend films?"
            answer:
              - "Glutton looks at the qualities that shape each film's experience and identifies patterns in how you respond to them."
              - "Your ratings provide the starting point. Your notes help explain why particular things worked for you, or why they didn't."
              - "That means Glutton can find connections between films that genres, popularity and conventional ratings might miss."
              - "Rate five films to get started with recommendations. Glutton assesses those ratings before recommendations become available."
          - question: "Are my ratings and notes private?"
            answer:
              - "Yes. Your ratings and notes are personal to you. They aren't published or shared with other Glutton users."
              - "Glutton uses your notes to understand your taste and improve your recommendations, including processing them through AI partners."
              - "The core experience is personal and private. You should be able to explore your relationship with horror without feeling like you're writing for an audience."
          - question: "Can I change my ratings and notes?"
            answer:
              - "Absolutely. And you should."
              - "Your taste changes over time, and so can your experience of a film. Something that didn't work for you the first time might become a favourite, or a film you once loved might lose some of its appeal."
              - "If a rewatch changes how you feel, update your rating and notes in Library. Your Glutton Profile will evolve alongside your taste."
          - question: "How can I help make Glutton better?"
            answer:
              - "By sharing your experiences."
              - "Today, Glutton uses your ratings and notes to understand which known qualities of a film matter to you. But there's much more to horror than what's easy to categorise."
              - "The particular kind of dread a film creates, the way its atmosphere gets under your skin, or why an ending stays with you long after the credits. These are the kinds of experiential qualities I'm building Glutton to understand."
              - "I'm developing richer ways to identify those qualities across films. As Glutton builds a deeper understanding of the experiences different films offer, it becomes better at recognising patterns and connecting people with exactly the kind of horror they're looking for."
              - "By contributing your experiences, you can help shape that future and make Glutton better for everyone."
      demo:
        description:
          - Every horror fan has their own taste. The films that get under your skin, the moments that stay with you, and the things everyone else seems to love that just don't work for you.
          - Glutton helps you explore what makes horror work for you. Rate the films you've watched, capture what stayed with you, and discover new favourites through recommendations shaped by your experiences.
        browse_feature: "Browse %{feature}"
        select: "Show example %{position} of %{count}"
        position: "Example %{position} of %{count}"
        get_started: There's more horror out there for you.
        invitation: Start with the films you've already watched. See what Glutton discovers about your taste.
        try_as_guest: Try as guest
        examples:
          alien:
            notes: |-
              I loved how slowly the tension builds. The quiet scenes had me watching the edges of the frame, waiting for something to move, instead of waiting for a loud noise to tell me to jump.

              The industrial spaceship felt like a real workplace. The clutter, the machinery and the crew's little frustrations made it easy to believe that these people had lives before the film began.

              I cared about who made it out because the crew felt vulnerable rather than heroic. The creature was frightening, but the isolation and the sense that nobody was coming to help stayed with me longest.
          the_thing:
            notes: I loved the paranoia and the practical creature effects; the distrust between the crew kept me tense even when nothing was happening.
          the_substance:
            notes: |-
              I loved how the sound and colour turned ordinary routines into something uncomfortable. The close attention to bodies, surfaces and small rituals made the pressure on the central character feel physical before the horror became extreme.

              The practical effects were gloriously excessive. They worked for me because the transformation was expressing the film's anger and desperation, rather than just supplying a creature to look at.

              Some of the satire repeated its point longer than I needed, which kept this from being an outright favourite. But I liked that it committed to its own strange tone instead of falling back on a predictable string of jump scares.
