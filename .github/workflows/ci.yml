name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        working-directory: test/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run repository checks
        env:
          RAILS_ENV: test
          GLUTTON_PLAYWRIGHT_TRACE: "1"
        run: bin/ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: |
            tmp/playwright-traces/
            tmp/screenshots/
          if-no-files-found: ignore
