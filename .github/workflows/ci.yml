name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run PostgreSQL migrations from scratch
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost/glutton_migration_check
        run: |
          bin/rails db:create
          bin/rails runner 'ActiveRecord::Base.connection_pool.migration_context.migrate'
      - name: Run repository checks
        env:
          # Chrome 158 fails during Capybara cookie cleanup.
          SE_CHROME_VERSION: '157.0.8103.78'
          SE_FORCE_BROWSER_DOWNLOAD: 'true'
          SE_SKIP_DRIVER_IN_PATH: 'true'
        run: bin/ci
